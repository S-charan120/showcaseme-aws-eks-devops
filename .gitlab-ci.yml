workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - api/**/*
        - web/**/*
        - infra/**/*
        - deploy/helm/**/*
        - .gitlab-ci.yml
    - when: never

stages:
  - validate
  - container-build
  - publish
  - promote

default:
  interruptible: true

api-test:
  stage: validate
  image: node:22-alpine
  script:
    - cd api
    - npm ci --no-audit --no-fund
    - npm test
    - npm run check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [api/**/*, .gitlab-ci.yml]

web-build:
  stage: validate
  image: node:22-alpine
  script:
    - cd web
    - npm ci --no-audit --no-fund
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [web/**/*, .gitlab-ci.yml]

terraform-validate:
  stage: validate
  image: hashicorp/terraform:1.10.5
  script:
    - cd infra/terraform
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [infra/**/*, .gitlab-ci.yml]

helm-validate:
  stage: validate
  image: alpine/helm:3.17.1
  script:
    - helm lint deploy/helm/showcaseme
    - helm template showcaseme deploy/helm/showcaseme --namespace showcaseme -f deploy/helm/showcaseme/values-aws.yaml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [deploy/helm/**/*, .gitlab-ci.yml]

container-build:
  stage: container-build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--tls=true"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
  script:
    - docker build -t showcaseme-api:test ./api
    - docker build -t showcaseme-web:test ./web
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [api/**/*, web/**/*, .gitlab-ci.yml]

# Create a GitLab OIDC id_token in the audience configured in Terraform.
# Configure AWS_ROLE_ARN, AWS_REGION, ECR_API_REPOSITORY, ECR_WEB_REPOSITORY and a masked GITOPS_PUSH_TOKEN.
ecr-publish:
  stage: publish
  resource_group: showcaseme-ecr-publish
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--tls=true"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  script:
    - apk add --no-cache aws-cli
    - test -n "$AWS_ROLE_ARN" && test -n "$AWS_REGION"
    - test -n "$ECR_API_REPOSITORY" && test -n "$ECR_WEB_REPOSITORY"
    - mkdir -p "$CI_PROJECT_DIR/.aws"
    - printf '%s' "$AWS_ID_TOKEN" > "$CI_PROJECT_DIR/.aws/web-identity-token"
    - export AWS_WEB_IDENTITY_TOKEN_FILE="$CI_PROJECT_DIR/.aws/web-identity-token"
    - export AWS_ROLE_SESSION_NAME="showcaseme-gitlab-$CI_PIPELINE_ID"
    - aws sts get-caller-identity
    - |
      set -eu
      API_REGISTRY="${ECR_API_REPOSITORY%%/*}"
      WEB_REGISTRY="${ECR_WEB_REPOSITORY%%/*}"
      test "$API_REGISTRY" = "$WEB_REGISTRY"
      aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$API_REGISTRY"
      API_REPOSITORY="${ECR_API_REPOSITORY##*/}"
      API_IMAGE="${ECR_API_REPOSITORY}:sha-${CI_COMMIT_SHA}"
      if aws ecr describe-images --repository-name "$API_REPOSITORY" --image-ids "imageTag=sha-${CI_COMMIT_SHA}" >/dev/null 2>&1; then
        echo "Reusing immutable API image sha-${CI_COMMIT_SHA}"
      else
        docker build -t "$API_IMAGE" ./api
        docker push "$API_IMAGE"
      fi
      WEB_REPOSITORY="${ECR_WEB_REPOSITORY##*/}"
      WEB_IMAGE="${ECR_WEB_REPOSITORY}:sha-${CI_COMMIT_SHA}"
      if aws ecr describe-images --repository-name "$WEB_REPOSITORY" --image-ids "imageTag=sha-${CI_COMMIT_SHA}" >/dev/null 2>&1; then
        echo "Reusing immutable web image sha-${CI_COMMIT_SHA}"
      else
        docker build -t "$WEB_IMAGE" ./web
        docker push "$WEB_IMAGE"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [api/**/*, web/**/*, .gitlab-ci.yml]

gitops-promote:
  stage: promote
  image: alpine:3.21
  resource_group: showcaseme-gitops-promotion
  needs: ["ecr-publish"]
  before_script:
    - apk add --no-cache git
  script:
    - test -n "$GITOPS_PUSH_TOKEN"
    - git config user.name "ShowcaseMe GitLab CI"
    - git config user.email "showcaseme-ci@example.invalid"
    - git remote set-url origin "https://oauth2:$GITOPS_PUSH_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git checkout -B gitops-promotion FETCH_HEAD
    - test "$(grep -Ec '^[[:space:]]+tag:' deploy/helm/showcaseme/values-aws.yaml)" -eq 2
    - sed -i -E "s|(^[[:space:]]+tag: ).*|\1sha-$CI_COMMIT_SHA|" deploy/helm/showcaseme/values-aws.yaml
    - test "$(grep -c "tag: sha-$CI_COMMIT_SHA" deploy/helm/showcaseme/values-aws.yaml)" -eq 2
    - git add deploy/helm/showcaseme/values-aws.yaml
    - git diff --cached --quiet && exit 0
    - git commit -m "chore(gitops): promote sha-$CI_COMMIT_SHA"
    - git push origin HEAD:"$CI_DEFAULT_BRANCH"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITOPS_PUSH_TOKEN'
      changes: [api/**/*, web/**/*, .gitlab-ci.yml]
