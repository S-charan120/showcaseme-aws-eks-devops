nameOverride: ""
fullnameOverride: ""

global:
  awsRegion: ap-south-1
  s3Bucket: ""

api:
  replicaCount: 2
  image:
    repository: showcaseme-api
    tag: bootstrap
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  serviceAccount:
    create: true
    name: showcaseme-api
    annotations: {}
  existingSecret: showcaseme-runtime
  env:
    - name: PORT
      value: "8081"
    - name: NODE_ENV
      value: production
    - name: AWS_REGION
      value: ap-south-1
    - name: PGSSLMODE
      value: require
    - name: S3_BUCKET
      value: ""
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

web:
  replicaCount: 2
  image:
    repository: showcaseme-web
    tag: bootstrap
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75

ingress:
  enabled: false
  className: alb
  host: portfolio.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: "200"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

rbac:
  observer:
    enabled: true
    serviceAccountName: showcaseme-observer
