apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/autoscaler
    chart: cluster-autoscaler
    targetRevision: 9.59.0
    helm:
      values: |
        cloudProvider: aws
        awsRegion: ap-south-1 # Must match aws_region in infra/terraform/variables.tf
        autoDiscovery:
          clusterName: showcaseme-dev # Must match project_name-environment in infra/terraform/variables.tf
        rbac:
          create: true
          serviceAccount:
            create: true
            name: cluster-autoscaler
            annotations:
              eks.amazonaws.com/role-arn: REPLACE_WITH_TERRAFORM_CLUSTER_AUTOSCALER_ROLE_ARN
        extraArgs:
          balance-similar-node-groups: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
